[project]
name = "task-08-tests-lint"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Evgenii Gorohov", email = "e.n.gorohov@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
task-08-tests-lint = "task_08_tests_lint:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
]
ignore = ["E501"]
